# XAVFSIZLIK-AUDIT.md Y-8: several routes carry the access token as a
# `?token=...` query param (img/anchor tags can't send an Authorization
# header — see app.js's authenticateFromQuery for the full rationale).
# nginx's default 'combined' log format logs $request, which includes the
# full query string — so every one of those tokens used to be written to
# access.log (and any backup/aggregator that ingests it) in plaintext, once
# per file view. This format logs the path without its query string
# instead. This file is included inside the base image's `http {}` block
# (see Dockerfile: copied to /etc/nginx/conf.d/default.conf, which the
# stock nginx.conf `include`s from inside `http {}`), so `log_format` is
# valid here even though it sits outside the `server {}` block below.
log_format no_query_string '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent"';

server {
    listen 5173;
    server_name localhost;
    client_max_body_size 50M;

    # XAVFSIZLIK-AUDIT.md (3-pass, #12): the stock build advertises its
    # exact build in every response ("Server: nginx/1.31.4"), which hands
    # anyone scanning the host a precise version to match known CVEs
    # against. `off` reduces it to the bare "nginx".
    server_tokens off;
    access_log /var/log/nginx/access.log no_query_string;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # EJM HTML - serve directly without SPA fallback.
    #
    # XAVFSIZLIK-AUDIT.md Y-4: X-Frame-Options was deliberately omitted
    # here to allow the React SPA to iframe this page — but SAMEORIGIN
    # allows exactly that (same-origin framing) while blocking every OTHER
    # site from iframing it, which is all the SPA ever needed. The old
    # "no header at all" let ANY external site iframe it and postMessage a
    # forged EMPLOYEE_CONTEXT (now also rejected by an origin check in the
    # page itself — see ejm.html).
    #
    # CSP here is looser than the rest of the app (script-src needs
    # 'unsafe-inline' — this file is one large inline <script>, not a
    # bundled external one like the SPA) but still blocks the things that
    # actually mattered for its XSS history: no plugins/objects, no
    # framing by other origins, no form/script/connect targets off this
    # origin.
    location = /ejm.html {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # index.html must never be cached — users always get the latest build
    # (add_header in a location block overrides server-level headers, so security headers are repeated)
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Hashed build assets (index-XXXX.js etc.) — safe to cache long-term
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Yuklangan fayllar (rasm, rezyume) — backend'dan proxy orqali
    #
    # XAVFSIZLIK-AUDIT.md (4-pass, Z-1): bu blokda X-Forwarded-For
    # o'rnatilmasdi, /api blokida esa o'rnatiladi. Backend ikkalasiga bir
    # xil `app.set('trust proxy', 1)` qo'llaydi — ya'ni Express har doim
    # XFF ro'yxatining o'ng chekkasidan BITTA yozuvni tashlab yuboradi.
    # Lekin o'sha yozuvni faqat /api bloki qo'shardi. Natijada /uploads
    # da Express bir pog'ona ortiqcha chapga tushib, `req.ip` ni noto'g'ri
    # hisoblardi: yo mijoz yuborgan (ya'ni hujumchi nazoratidagi) qiymatga,
    # yo hamma uchun bir xil konteyner IP'siga.
    #
    # Bu app.js dagi `app.use('/uploads', generalLimiter)` ni kuchsiz
    # qilardi — holbuki o'sha limiter aynan yagona autentifikatsiyasiz
    # fayl marshrutini (/uploads/onboarding/submissions/:filename)
    # himoya qilish uchun qo'yilgan. Endi ikkala yo'l bir xil ishlaydi.
    location /uploads {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # API proxy
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_max_temp_file_size 0;
        client_max_body_size 50M;

        # Cookie path: backend cookie'larini / ga yo'naltirish
        proxy_cookie_path / /;
    }

    # Security headers
    # XAVFSIZLIK-AUDIT.md O-4/P-9: CSP added (was entirely absent — the
    # single biggest reduction in blast radius for the stored/reflected XSS
    # findings above, since even an injection that slipped past sanitization
    # would still be blocked from running/exfiltrating by the browser).
    # X-XSS-Protection dropped — modern browsers ignore it, and CSP is the
    # actual replacement.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS: only meaningful once TLS terminates in front of this container
    # (this server block itself only speaks plain HTTP — see docker-compose
    # port binding). Harmless to send either way (ignored by browsers over
    # plain HTTP), and takes effect automatically the moment TLS is added
    # in front. XAVFSIZLIK-AUDIT.md O-5 — confirm the actual TLS-terminating
    # layer (outside this repo) also sends this.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
