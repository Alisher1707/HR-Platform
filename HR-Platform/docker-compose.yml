name: hr-platform

services:
  # XAVFSIZLIK-AUDIT.md P-6: postgres:16-alpine image'ida `openssl` CLI yo'q
  # (faqat busybox'ning cheklangan ssl_client'i), shuning uchun sertifikatni
  # alohida, faqat shu ish uchun ishlaydigan konteynerda yasaymiz va
  # `pg_certs` volume'ga yozamiz — postgres konteyneri keyin shu volume'ni
  # faqat o'qish uchun ulaydi. Fayl allaqachon bo'lsa qayta yaratilmaydi
  # (data volume o'chirilmaguncha bir marta ishlaydi).
  pg-certs:
    image: alpine:3.20
    container_name: hr_platform_pg_certs
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /certs/server.key ]; then
          apk add --no-cache openssl >/dev/null
          openssl req -new -x509 -days 3650 -nodes -subj '/CN=hr-platform-postgres' \
            -out /certs/server.crt -keyout /certs/server.key
          # postgres:16-alpine ichidagi `postgres` foydalanuvchisi uid/gid 70 —
          # kalit fayl shu egaga va faqat 0600 ruxsatga tegishli bo'lishi
          # shart, aks holda Postgres uni rad etib ishga tushmaydi.
          chown 70:70 /certs/server.crt /certs/server.key
          chmod 600 /certs/server.key
          chmod 644 /certs/server.crt
        fi
    volumes:
      - pg_certs:/certs

  postgres:
    image: postgres:16-alpine
    container_name: hr_platform_db
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
    environment:
      POSTGRES_DB: hr_platform
      POSTGRES_USER: postgres
      # .env da albatta belgilanishi kerak — bu yerda zaif standart qiymat
      # atayin qoldirilmagan (ilgari "password" edi).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida belgilanishi shart}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - pg_certs:/certs:ro
    networks:
      - hr_network
    depends_on:
      pg-certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./apps/backend
    container_name: hr_platform_backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL .env faylida belgilanishi shart}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      PORT: ${PORT:-5000}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL .env faylida belgilanishi shart}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET .env faylida belgilanishi shart}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET .env faylida belgilanishi shart}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      INVITE_TOKEN_EXPIRES_DAYS: ${INVITE_TOKEN_EXPIRES_DAYS:-7}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Butun manba kodi ENDI image ichida qotib qoladi (rebuild/rollback
    # ma'noli bo'ladi) — faqat haqiqatan HOLAT bo'lgan narsa (yuklangan
    # fayllar: rasm, rezyume, jarima dalillari, EJM hujjatlari va h.k.)
    # host'da saqlanadi, deploy'lar orasida yo'qolmasligi uchun.
    volumes:
      - ./apps/backend/uploads:/app/uploads
    networks:
      - hr_network
    restart: unless-stopped
    # XAVFSIZLIK-AUDIT.md O-6: the image now runs as the non-root `node`
    # user (see Dockerfile), not root. A bind mount like the one above
    # keeps the HOST directory's own ownership — the image-side `chown`
    # doesn't apply to it. On first deploy after this change, run on the
    # HOST:  sudo chown -R 1000:1000 apps/backend/uploads
    # (1000 is node:node's uid/gid in the node:20-alpine base image) or
    # uploads will start failing with EACCES.

  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: hr_platform_frontend
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - hr_network
    restart: unless-stopped

volumes:
  postgres_data:
  pg_certs:

networks:
  hr_network:
    driver: bridge
